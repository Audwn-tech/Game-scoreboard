<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>

    <body>

        <div class="page">

            <div class="ad-side">
                AD
            </div>

            <div class="container">

<div class="timer">
    <span id="timer-display">00:00</span>

    <div>
        <button id="start-btn">START</button>
        <button id="pause-btn">PAUSE</button>
        <button id="timer-reset-btn">RESET TIMER</button>
    </div>
</div>

                <div class="scores">

                    <div class="home">
    <input type="text" class="team-name" id="home-name" value="HOME">

    <h1 class="score-text" id="home-score">0</h1>
    <p class="leader" id="home-leader"></p>

    <div>
        <button class="minus-btn">-1</button>
        <button class="add1-btn">+1</button>
        <button class="add2-btn">+2</button>
        <button class="add3-btn">+3</button>
    </div>
</div>

<div class="guest">
    <input type="text" class="team-name" id="guest-name" value="GUEST">

    <h1 class="score-text" id="guest-score">0</h1>
    <p class="leader" id="guest-leader"></p>

    <div>
        <button class="minus-btn">-1</button>
        <button class="add1-btn">+1</button>
        <button class="add2-btn">+2</button>
        <button class="add3-btn">+3</button>
    </div>
</div>

                </div>

                <div class="reset">
                    <button id="reset-btn">RESET</button>
                </div>

            </div>

            <div class="ad-side">
                AD
            </div>

        </div>

        <div class="ad-bottom">
            AD BANNER
        </div>

        <script src="index.js"></script>
    </body>
</html>
